name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend · type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npx vitest run --config vitest.config.ts

      - name: Production build
        run: npx vite build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bhoomilens-dist
          path: dist
          retention-days: 7

  backend:
    name: Backend · API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: pytest

      - name: Export the OpenAPI document
        run: |
          python - <<'PY'
          import json
          from app.main import create_app
          with open("openapi.json", "w", encoding="utf-8") as handle:
              json.dump(create_app().openapi(), handle, indent=2)
          print("OpenAPI document written")
          PY

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: bhoomilens-openapi
          path: backend/openapi.json
          retention-days: 7

  containers:
    name: Containers · build images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image
        run: docker build -t bhoomilens-web:ci .

      - name: Build the API image
        run: docker build -t bhoomilens-api:ci ./backend

      - name: Smoke-test the API image
        run: |
          docker run -d --name bhoomilens-api -p 8000:8000 bhoomilens-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 2
          done
          docker logs bhoomilens-api
          exit 1
